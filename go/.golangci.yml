# Lint configuration for the Go core (golangci-lint v2). CI keeps it at zero.
version: "2"
run:
  timeout: 5m
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout for memory, not correctness
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    paths:
      - vendor
formatters:
  enable:
    - gofmt
    - goimports
