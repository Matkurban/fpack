name: Snap build modes

# Real snapcraft builds of the example app in the isolated build modes
# (linux.snap.build_mode lxd and multipass); the destructive mode is covered
# by e2e.yml. Each job builds the snap, installs it, starts it under Xvfb and
# removes it.
on:
  workflow_dispatch:
  push:
    branches: [main, snap-modes]
    paths: ["go/internal/targets/snap*.go", ".github/workflows/snap-modes.yml", "example/**"]

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  snap:
    name: snap-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [lxd, multipass]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: system packages and snapcraft
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev xvfb
          sudo snap install snapcraft --classic
      - name: activate fpack from path (bundled binary)
        run: |
          scripts/build_binaries.sh linux/amd64
          dart pub global activate --source path .
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: LXD
        if: matrix.mode == 'lxd'
        uses: canonical/setup-lxd@main
      - name: Multipass (KVM)
        if: matrix.mode == 'multipass'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo snap install multipass
          for i in $(seq 1 60); do [ -S /var/snap/multipass/common/multipass_socket ] && break; sleep 2; done
          sudo chmod a+rw /var/snap/multipass/common/multipass_socket
          multipass version
      - name: fpack build snap (${{ matrix.mode }})
        working-directory: example
        env:
          FPACK_SNAP_BUILD_MODE: ${{ matrix.mode }}
        run: |
          flutter pub get
          fpack doctor || true
          fpack build snap --dry-run
          set +e
          fpack build snap --json > result.json
          code=$?
          python3 "$GITHUB_WORKSPACE/scripts/e2e_check.py" result.json snap || code=1
          [ $code -eq 0 ] || { cat result.json; tail -60 build/fpack/logs/*snap*.log; exit 1; }
          set -e
          grep -q -- "--use-lxd\|SNAPCRAFT_BUILD_ENVIRONMENT=multipass\|snapcraft pack --output" build/fpack/logs/*snap*.log
          git status --porcelain --untracked-files=no -- . | tee /tmp/changes.txt
          test ! -s /tmp/changes.txt
      - name: install, run, remove
        working-directory: example
        run: |
          set -eu
          s=$(ls dist/*/*.snap)
          unsquashfs -l "$s" | grep -E "meta/snap.yaml|meta/gui/aurora-notes.desktop|fpack_example$"
          sudo snap install --dangerous "$s"
          snap list aurora-notes
          set +e
          xvfb-run -a timeout 25 aurora-notes > "$RUNNER_TEMP/run.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/run.log"
          [ $code -eq 124 ] || { echo "app exited with $code instead of running"; exit 1; }
          sudo snap remove --purge aurora-notes
          ! snap list aurora-notes 2>/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snap-${{ matrix.mode }}
          path: |
            example/build/fpack/logs/
            example/result.json
