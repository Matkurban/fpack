name: CI

on:
  # Runs only when pubspec.yaml's version changes (see the check job) or by
  # hand: gh workflow run ci.yml
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: proceed only when pubspec.yaml's `version:` line changed
  # (dependency edits in pubspec.yaml do not count) or when run by hand.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: version
        run: |
          old=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep -m1 '^version:' || true)
          new=$(grep -m1 '^version:' pubspec.yaml)
          if [ "$old" != "$new" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          echo "previous: ${old:-none}  current: $new"

  test:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: versions match
        shell: bash
        run: scripts/check_versions.sh

      - name: go vet + test
        working-directory: go
        shell: bash
        run: |
          go version
          test "$(go env GOVERSION)" = "$(sed -n 's/^toolchain //p' go.mod)" || { echo "::error::Go $(go env GOVERSION) != go.mod toolchain"; exit 1; }
          go vet ./...
          go test ./...

      - name: dart analyze + test
        run: |
          dart pub get --no-example
          dart format --output=none --set-exit-if-changed lib bin test
          dart analyze --fatal-infos
          dart test

      - name: cross-compile all binaries
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/build_binaries.sh

  lint:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    name: lint (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: install linters (built with the project toolchain)
        working-directory: go
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - name: golangci-lint + staticcheck (linux, windows, darwin)
        working-directory: go
        shell: bash
        run: |
          for os in linux windows darwin; do
            echo "::group::GOOS=$os"
            GOOS=$os go vet ./...
            GOOS=$os golangci-lint run --max-issues-per-linter 0 --max-same-issues 0 ./...
            GOOS=$os staticcheck -checks all ./...
            echo "::endgroup::"
          done

  # Real end-to-end packaging on every host: see e2e.yml.
