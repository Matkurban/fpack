name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: versions match
        shell: bash
        run: scripts/check_versions.sh

      - name: go vet + test
        working-directory: go
        shell: bash
        run: |
          go version
          test "$(go env GOVERSION)" = "$(sed -n 's/^toolchain //p' go.mod)" || { echo "::error::Go $(go env GOVERSION) != go.mod toolchain"; exit 1; }
          go vet ./...
          go test ./...

      - name: dart analyze + test
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib bin test
          dart analyze --fatal-infos
          dart test

      - name: cross-compile all binaries
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/build_binaries.sh

  # Real end-to-end packaging on every host: see e2e.yml.
