name: Docs

# Builds the Jaspr documentation site in website/ and deploys it to GitHub
# Pages (https://matkurban.github.io/fpack/).
on:
  # Runs only when pubspec.yaml's version changes (see the check job) or by
  # hand: gh workflow run docs.yml
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: proceed only when pubspec.yaml's `version:` line changed
  # (dependency edits in pubspec.yaml do not count) or when run by hand.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: version
        run: |
          old=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep -m1 '^version:' || true)
          new=$(grep -m1 '^version:' pubspec.yaml)
          if [ "$old" != "$new" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          echo "previous: ${old:-none}  current: $new"

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: generated reference pages are up to date
        working-directory: go
        run: go test ./internal/cli -run TestWebsiteUpToDate
      - name: analyze and test
        working-directory: website
        run: |
          dart pub get
          tool/l10n.sh
          git diff --exit-code lib/l10n   # app_en.arb and lib/l10n/gen match the messages
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test
      - name: jaspr build
        working-directory: website
        run: |
          dart pub global activate jaspr_cli 0.23.5
          "$HOME/.pub-cache/bin/jaspr" build
          python3 tool/postbuild.py --dir build/jaspr --base /fpack/ --site-url https://matkurban.github.io/fpack/
          python3 tool/check_links.py --dir build/jaspr --base /fpack/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build/jaspr

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
