name: Release

# Push a tag like v1.0.0 (must equal pubspec.yaml version, lib/src/version.dart
# and go/internal/version/version.go).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # pub.dev automated publishing (OIDC)

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: check tag
        run: scripts/check_versions.sh "${GITHUB_REF_NAME}"
      - name: cross-compile
        run: OUT=release scripts/build_binaries.sh
      - name: self-contained archive (offline path install)
        run: scripts/package_dist.sh "release/fpack-${GITHUB_REF_NAME}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt
          path: prebuilt/
      # A release created by hand (gh release create) is left untouched, so
      # its assets and checksums are never replaced by a second build.
      - name: release already exists?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release $GITHUB_REF_NAME already exists – not uploading assets"
          fi
      - name: GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

  # Optional: publish to pub.dev. Enable automated publishing for this repo
  # on pub.dev (Admin → Automated publishing → GitHub Actions, tag pattern v{{version}}).
  # Whether the binaries are bundled is controlled by BUNDLE_BINARIES (see README.md:
  # "pub.dev package size trade-off").
  publish:
    needs: binaries
    if: ${{ vars.PUB_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v8
        if: ${{ vars.BUNDLE_BINARIES == 'true' }}
        with:
          name: prebuilt
          path: prebuilt/
      - name: allow prebuilt/ in the package
        if: ${{ vars.BUNDLE_BINARIES == 'true' }}
        # A root .pubignore replaces .gitignore for pub, so repeat its rules
        # minus prebuilt/.
        run: |
          grep -v '^prebuilt/\*$' .gitignore | grep -v '^!prebuilt/README.md$' > .pubignore
          printf '.github/\n' >> .pubignore
      - run: dart pub get
      - run: dart pub publish --force
